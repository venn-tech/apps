services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hackaton
      POSTGRES_PASSWORD: hackaton
      POSTGRES_DB: hackaton
    ports: ["2020:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackaton"]
      interval: 5s
      retries: 10

  # S3 local para desenvolvimento. Em producao use Supabase Storage ou Cloudflare R2 (variaveis S3_*).
  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: hackaton
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/bitnami/minio/data]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://hackaton:hackaton@db:5432/hackaton
      S3_ENDPOINT: http://minio:9000
    depends_on:
      db: { condition: service_healthy }
    ports: ["${PORT:-3334}:${PORT:-3334}"]

volumes:
  pgdata:
  miniodata:
